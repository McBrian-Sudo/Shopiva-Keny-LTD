{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b31">
<meta name="description" content="Shopiva Kenya LTD — live deals, trusted sellers, smart shopping and tracked delivery across Kenya.">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Shopiva Kenya LTD | Smart Shopping in Kenya</title>
<style>
:root{--navy:#061a2f;--ink:#101a25;--green:#19d978;--green2:#0fba62;--paper:#f5f7fa;--white:#fff;--line:#e4e8ed;--muted:#697684;--red:#f32935;--gold:#ffbd36;--shadow:0 18px 50px rgba(6,26,47,.10)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.4;overflow-x:hidden}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{width:min(1480px,calc(100% - 34px));margin:auto}

.nav{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(6,26,47,.08)}.nav-in{min-height:78px;display:flex;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px;min-width:205px}.brand-copy{line-height:1}.brand-copy b{font-size:24px;letter-spacing:-.065em}.brand-copy b span{color:var(--green2)}.brand-copy small{display:block;margin-top:3px;font-size:8px;letter-spacing:.29em;color:#7a8791;font-weight:900}.brand-fallback{width:0;height:0;display:none}.search{flex:1;max-width:670px;display:flex;align-items:center;gap:7px;background:#f2f5f8;border:1px solid #dbe2e8;border-radius:13px;padding:5px}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:11px 12px;font-size:13px}.search button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:11px 18px;font-size:11px;font-weight:1000;cursor:pointer}.links{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:1000}.links a{padding:11px 12px;border-radius:11px;white-space:nowrap}.links a:hover{background:#eef5f0}.login{background:#f0edff;color:#6547b7}.signup{background:var(--navy);color:#fff}.sell{background:#e9fff2;color:#097646}.cart{background:var(--green);color:#062313}

.hero{position:relative;height:500px;margin:15px 0 22px;border-radius:24px;overflow:hidden;background:#071b31;color:#fff;box-shadow:var(--shadow)}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.035);transition:opacity .65s ease,transform 6s ease;display:flex}.slide.active{opacity:1;visibility:visible;transform:scale(1)}.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,12,25,.58) 0%,rgba(4,19,37,.46) 35%,rgba(4,19,37,.10) 63%,rgba(4,19,37,.04) 100%);z-index:1}.slide-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.slide:nth-child(1){background:#0d2440}.slide:nth-child(2){background:#28132f}.slide:nth-child(3){background:#2c180b}.slide:nth-child(4){background:#101a32}.slide:nth-child(5){background:#13291d}.slide:nth-child(6){background:#241321}.slide:nth-child(7){background:#0e1c29}.slide:nth-child(8){background:#1d160e}.hero-content{position:relative;z-index:3;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:center;gap:36px;padding:40px 52px 68px}.copy{max-width:730px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);font-size:10px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(25,217,120,.10)}.copy h1{font-size:clamp(38px,5.3vw,74px);line-height:.92;letter-spacing:-.07em;margin:17px 0}.copy h1 span{color:var(--green)}.copy p{max-width:640px;color:rgba(255,255,255,.82);font-size:15px;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 17px;border-radius:11px;font-size:10px;font-weight:1000}.btn-white{background:#fff;color:var(--navy)}.btn-green{background:var(--green);color:#052111}.btn-outline{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}.product-showcase{align-self:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:12px;backdrop-filter:blur(12px);box-shadow:0 30px 80px rgba(0,0,0,.28)}.showcase-image{height:255px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.10);position:relative}.showcase-image img{width:100%;height:100%;object-fit:cover;display:block}.showcase-tag{position:absolute;left:10px;top:10px;padding:6px 9px;border-radius:999px;background:rgba(5,24,42,.80);font-size:9px;font-weight:1000}.showcase-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 4px 3px}.showcase-foot strong{font-size:15px;display:block}.showcase-foot small{display:block;color:rgba(255,255,255,.65);font-size:9px;margin-top:3px}.showcase-price{color:var(--green);font-size:18px;font-weight:1000}.old-price{text-decoration:line-through;color:rgba(255,255,255,.42);font-size:9px;margin-left:5px}.mini-cta{padding:9px 11px;border-radius:10px;background:var(--green);color:#062313;font-size:9px;font-weight:1000;white-space:nowrap}.hero-controls{position:absolute;z-index:10;left:52px;right:52px;bottom:14px;display:flex;align-items:center;justify-content:space-between}.dots{display:flex;align-items:center;gap:6px}.dot{width:28px;height:5px;border:0;border-radius:999px;background:rgba(255,255,255,.30);cursor:pointer;transition:.25s}.dot.active{width:52px;background:var(--green)}.arrows{display:flex;gap:7px}.arrow{width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:#fff;font-size:18px;cursor:pointer}.arrow:hover{background:rgba(255,255,255,.18)}.progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.15);z-index:11}.progress i{display:block;height:100%;width:0;background:var(--green)}
.quick{padding-bottom:2px}.quickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.quick-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:0;display:flex;gap:0;align-items:stretch;min-height:82px;overflow:hidden;box-shadow:0 6px 22px rgba(6,26,47,.035);transition:.2s}.quick-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(6,26,47,.08)}.quick-icon{width:78px;height:82px;flex:0 0 78px;border-radius:0;display:block;background-size:cover;background-position:center}.quick-card>span:last-child{padding:12px 10px;display:flex;justify-content:center;flex-direction:column}.quick-card b{display:block;font-size:10px}.quick-card small{display:block;color:#7b8790;font-size:8px;margin-top:2px}
.section{padding-top:36px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.kicker{font-size:9px;font-weight:1000;letter-spacing:.18em;text-transform:uppercase;color:#11894d}.head h2{font-size:clamp(26px,3.5vw,39px);line-height:1;letter-spacing:-.06em;margin-top:5px}.head p{margin-top:7px;color:var(--muted);font-size:10px;max-width:700px}.head a{font-size:10px;color:#10874a;font-weight:1000;white-space:nowrap}
.categories{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}.cat{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0 0 9px;text-align:center;transition:.2s}.cat:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(6,26,47,.08)}.cat-icon{width:100%;height:108px;border-radius:0;margin:0 0 8px;display:block;background-size:cover;background-position:center;background-repeat:no-repeat}.cat b{font-size:8px}.c1{background:#e9f6ff}.c2{background:#eafff2}.c3{background:#fff0f7}.c4{background:#fff4df}.c5{background:#eeebff}.c6{background:#e4fbf7}.c7{background:#f4f7df}.c8{background:#ffe8ee}.c9{background:#e9efff}.c10{background:#f7ecff}.c11{background:#edf5f5}.c12{background:#eef4ff}
.services{margin-top:11px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px}.service{display:flex;align-items:center;gap:10px;padding:7px 16px;border-right:1px solid #edf1f3}.service:last-child{border-right:0}.service i{font-style:normal;font-size:22px}.service b{display:block;font-size:10px}.service span{display:block;color:#7b8790;font-size:8px;margin-top:2px}
.deals{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.deal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 7px 20px rgba(6,26,47,.04);transition:.2s}.deal:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(6,26,47,.08)}.deal-media{height:200px;background:#eef3f5;position:relative;overflow:hidden}.deal-media img{width:100%;height:100%;object-fit:cover}.deal-placeholder{height:100%;display:grid;place-items:center;font-size:52px}.sale{position:absolute;left:9px;top:9px;padding:5px 8px;border-radius:999px;background:var(--red);color:#fff;font-size:9px;font-weight:1000}.deal-body{padding:13px}.deal-body h3{font-size:13px;line-height:1.25}.deal-body small{display:block;color:#7d8991;font-size:8px;margin-top:4px}.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:9px}.price{font-size:17px;color:#0a8a49;font-weight:1000}.old{font-size:8px;text-decoration:line-through;color:#99a2a7;margin-left:4px}.deal-btn{display:inline-flex;padding:8px 10px;background:#eafff2;color:#087641;border-radius:10px;font-size:9px;font-weight:1000}
.budget{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.budget-card{position:relative;overflow:hidden;min-height:205px;padding:24px;border-radius:20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-start;box-shadow:0 14px 34px rgba(6,26,47,.10);border:1px solid rgba(255,255,255,.24);transition:transform .25s ease,box-shadow .25s ease;background-size:cover;background-position:center}
.budget-card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(4,25,45,.78),rgba(4,25,45,.24));z-index:0}
.budget-card>*{position:relative;z-index:1}
.budget-card:hover{transform:translateY(-5px);box-shadow:0 22px 45px rgba(6,26,47,.16)}
.budget-one{background-image:url('https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=1200&q=85')}
.budget-two{background-image:url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=85')}
.budget-three{background-image:url('https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1200&q=85')}
.budget-top{display:flex;flex-direction:column;gap:5px}
.budget-top small{font-size:9px;letter-spacing:.14em;font-weight:1000;opacity:.82}
.budget-top b{font-size:22px;letter-spacing:-.05em}
.budget-card p{max-width:370px;font-size:10px;line-height:1.55;opacity:.9;margin-top:9px}
.budget-link{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;margin-top:auto;padding:9px 12px;border-radius:10px;background:#fff;color:var(--navy);font-size:9px;font-weight:1000}
.budget-icon{position:absolute!important;right:20px;top:18px;font-size:34px;opacity:.85;filter:drop-shadow(0 5px 12px rgba(0,0,0,.2))}
.smart{margin-top:14px;display:grid;grid-template-columns:1.45fr .55fr;gap:14px}
.smart-main,.smart-side{border-radius:20px;padding:22px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(6,26,47,.045)}
.smart-main{background:linear-gradient(135deg,#fff,#f8fbf9)}
.smart-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.smart-main h3{font-size:24px;line-height:1.1;letter-spacing:-.05em;margin-top:5px}
.smart-main p{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.6;max-width:800px}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#eafff2;color:#087641;font-size:9px;font-weight:1000}
</style>
</head>
<body>
<header class="nav"><div class="wrap nav-in">
  <a class="brand" href="{% url 'home' %}" aria-label="Shopiva Kenya LTD home"><span class="brand-fallback" aria-hidden="true"></span><span class="brand-copy"><b>Shop<span>iva</span></b><small>KENYA LTD</small></span></a>
  <form class="search" action="{% url 'products' %}" method="get"><input name="q" value="{{ request.GET.q|default:'' }}" placeholder="Search products, brands, deals and more..." aria-label="Search products"><button type="submit">🔎 Search</button></form>
  <nav class="links" aria-label="Primary"><a href="{% url 'home' %}">Home Shop</a><a href="{% url 'categories' %}">📁 Categories</a><a class="sell" href="{% url 'seller_login' %}">🏪 Sell on Shopiva</a><a class="login" href="{% url 'customer_login' %}">🔐 Log in</a><a class="signup" href="{% url 'customer_register' %}">✦ Sign Up</a><a class="cart" href="{% url 'cart' %}">🛒 Cart</a></nav>
</div></header>

<div class="wrap">
<!-- existing hero and marketplace content -->
{% block content %}{% endblock %}
</div>
</body>
</html>
