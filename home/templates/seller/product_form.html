<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product | Shopiva</title><style>body{font-family:Inter,system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:22px;padding:30px}label{display:block;font-weight:800;margin:15px 0 7px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5e2;border-radius:10px}textarea{min-height:110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.btn{margin-top:20px;background:#1457e6;color:#fff;border:0;padding:13px 18px;border-radius:10px;font-weight:800}.err{background:#fff1f1;color:#a11;padding:12px;border-radius:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>Add a product</h1>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Product name</label><input name="name" required><label>Description</label><textarea name="description"></textarea><div class="grid"><div><label>Category</label><input name="category" value="General"></div><div><label>SKU</label><input name="sku"></div><div><label>Price (KSh)</label><input name="price" type="number" step="0.01" min="0.01" required></div><div><label>Stock quantity</label><input name="stock_quantity" type="number" min="0" required></div><div><label>Discount %</label><input name="discount_percent" type="number" min="0" max="100" value="0"></div><div><label>Promotion text</label><input name="promo_text" placeholder="Optional offer"></div></div><label>Product image</label><input name="image" type="file" accept="image/*"><button class="btn">List Product</button></form><p><a href="{% url 'seller_dashboard' %}">← Seller dashboard</a></p></div></main></body></html>
