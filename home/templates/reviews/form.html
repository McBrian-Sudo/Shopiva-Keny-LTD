<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review {{ product.name }} | Shopiva</title><style>body{font-family:Inter,system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:650px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:28px;border:1px solid #e5e7eb}label{display:block;font-weight:800;margin:14px 0 7px}select,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:10px;box-sizing:border-box}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#1457e6;color:#fff;font-weight:800}</style></head><body><main class="wrap"><div class="card"><h1>Review {{ product.name }}</h1><p>Verified reviews are available only after a delivered Shopiva purchase.</p><form method="post">{% csrf_token %}<label>Rating</label>{{ form.rating }}<label>Comment</label>{{ form.comment }}<label>Purchase</label><select name="order_id" required>{% for order in orders %}<option value="{{ order.id }}">Order {{ order.tracking_code }}</option>{% endfor %}</select><button>Publish verified review</button></form><p><a href="{% url 'product_detail' product.id %}">← Back to product</a></p></div></main></body></html>
