<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Delivery Map | Shopiva</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top h1{margin:0}.top a{color:#1557d6;text-decoration:none;font-weight:800;font-size:12px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stat{background:#fff;border:1px solid #dfe7ee;border-radius:12px;padding:12px 16px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#667085}.map{height:650px;background:#e9eef4;border-radius:16px;border:1px solid #dbe2ea}.status{margin:10px 0;padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:11px}button{border:0;border-radius:9px;padding:9px 12px;background:#1557d6;color:#fff;font-weight:800;cursor:pointer}.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}</style></head><body><main class="wrap"><div class="top"><div><h1>Live Delivery Map</h1><div style="font-size:12px;color:#667085">Google Maps operations view for Shopiva riders.</div></div><a href="/admin/">← Control Center</a></div><div class="stats"><div class="stat"><b id="riders">0</b><span>Riders visible</span></div><div class="stat"><b id="live">0</b><span>Live now</span></div><div class="stat"><b id="orders">0</b><span>Assigned orders</span></div></div><div class="toolbar"><button id="refresh">↻ Refresh</button><span id="updated" style="font-size:11px;color:#667085"></span></div><div id="status" class="status">Loading Google Maps…</div><div id="map" class="map"></div></main>{% if google_maps_api_key %}<script src="https://maps.googleapis.com/maps/api/js?key={{google_maps_api_key|urlencode}}&v=weekly&loading=async" async></script><script>(async()=>{const status=document.getElementById('status'),seen=new Map();try{for(let i=0;i<100&&!window.google;i++)await new Promise(r=>setTimeout(r,100));if(!window.google)throw 0;const[{Map},{AdvancedMarkerElement}]=await Promise.all([google.maps.importLibrary('maps'),google.maps.importLibrary('marker')]);const map=new Map(document.getElementById('map'),{center:{lat:-1.2921,lng:36.8219},zoom:6,mapId:'{{google_maps_map_id|default:"DEMO_MAP_ID"|escapejs}}'});async function load(){const res=await fetch('{% url "shopiva_admin:delivery_locations" %}',{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw 0;const data=await res.json();seen.forEach(m=>m.map=null);seen.clear();let live=0,orders=0;for(const a of(data.agents||[])){const p={lat:+a.latitude,lng:+a.longitude};if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng))continue;const marker=new AdvancedMarkerElement({map,position:p,title:a.name+' · '+a.status});marker.addListener('click',()=>{const q='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat+','+p.lng);window.open(q,'_blank','noopener');});seen.set(a.id,marker);if(a.live)live++;if(a.order_id)orders++;}document.getElementById('riders').textContent=seen.size;document.getElementById('live').textContent=live;document.getElementById('orders').textContent=orders;document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString();status.className='';status.textContent='Google Maps is live. Rider markers refresh automatically.'}document.getElementById('refresh').onclick=load;await load();setInterval(load,20000)}catch(e){status.textContent='Google Maps could not start. Check API key, billing, Maps JavaScript API, key restrictions and Map ID.'}})()</script>{% else %}<script>document.getElementById('status').textContent='Google Maps is not configured. Add GOOGLE_MAPS_API_KEY and GOOGLE_MAPS_MAP_ID in Render.';</script>{% endif %}</body></html>
