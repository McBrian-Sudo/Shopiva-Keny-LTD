<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Shopiva</title><style>body{font-family:Inter,system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:800px;margin:30px auto;padding:20px}.item{background:#fff;padding:18px;border-radius:16px;border:1px solid #e5e7eb;margin:10px 0}.date{font-size:12px;color:#667085}</style></head><body><main class="wrap"><h1>Shopiva notifications</h1>{% for n in notifications %}<article class="item"><strong>{{ n.title }}</strong><p>{{ n.message }}</p>{% if n.link %}<a href="{{ n.link }}">Open</a>{% endif %}<div class="date">{{ n.created_at }}</div></article>{% empty %}<div class="item">You're all caught up.</div>{% endfor %}<p><a href="{% url 'customer_dashboard' %}">← Account</a></p></main></body></html>
