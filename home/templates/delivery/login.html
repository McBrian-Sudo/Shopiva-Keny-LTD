<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#052e1b"><link rel="manifest" href="{% url 'delivery_manifest' %}">
<title>Shopiva Delivery</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#0b5b35,#03170e 55%,#020b07);color:#fff;display:grid;place-items:center;padding:22px}
.card{width:min(440px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px);border-radius:28px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.35)}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,#20c96b,#0b7a42);display:grid;place-items:center;font-size:36px;font-weight:950;box-shadow:0 12px 30px rgba(32,201,107,.3)}
h1{margin:18px 0 6px;font-size:32px;letter-spacing:-.05em}.sub{color:#b8d7c6;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid #355c49;background:#06170f;color:#fff;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#21c66b;color:#052e1b;font-weight:950;font-size:15px;cursor:pointer}.errors{background:#4c1515;border:1px solid #8c3838;border-radius:12px;padding:11px;color:#ffd2d2;font-size:12px}
small{display:block;margin-top:18px;color:#8db3a0;text-align:center;line-height:1.5}
</style></head><body><main class="card"><div class="logo">S</div><h1>Shopiva Delivery</h1><div class="sub">Secure delivery partner workspace</div>
{% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
<form method="post">{% csrf_token %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}<button>Sign in to Delivery</button></form>
<small>Location sharing is only activated after you sign in and grant GPS permission.</small></main></body></html>
