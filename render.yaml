services:
  - type: web
    name: shopiva-keny-ltd
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn shopiva.wsgi:application

    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "shopiva-keny-ltd.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shopiva-keny-ltd.onrender.com"
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: EMAIL_HOST
        value: "smtp.resend.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: "resend"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SMS_NOTIFICATIONS_ENABLED
        value: "false"
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: WHATSAPP_NOTIFICATIONS_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: "v23.0"
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: "en_US"
