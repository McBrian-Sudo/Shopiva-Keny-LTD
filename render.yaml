services:
  - type: web
    name: shopiva-keny-ltd
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn shopiva.wsgi:application

    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "shopiva-keny-ltd.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shopiva-keny-ltd.onrender.com"
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
