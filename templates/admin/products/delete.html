<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete Product · Shopiva</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{max-width:700px;margin:70px auto;padding:20px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:30px;box-shadow:0 8px 25px rgba(15,23,42,.06)}.icon{font-size:45px}.danger{color:#991b1b}.muted{color:#64748b;line-height:1.6}.actions{display:flex;gap:10px;margin-top:22px}.btn{padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:900;border:0;cursor:pointer}.cancel{background:#e5e7eb;color:#334155}.delete{background:#dc2626;color:white}@media(max-width:600px){.wrap{margin:20px auto}.actions{flex-direction:column}}</style></head><body><div class="wrap"><section class="card"><div class="icon">🗑️</div><h1 class="danger">Delete product?</h1><p class="muted">You are about to permanently delete <strong>{{ product.name }}</strong>. This action uses Django's database layer and cannot be undone.</p><form method="post">{% csrf_token %}<div class="actions"><a class="btn cancel" href="{% url 'shopiva_admin:product_manager' %}">Cancel</a><button class="btn delete" type="submit">Delete Product</button></div></form></section></div></body></html>
