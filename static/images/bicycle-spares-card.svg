<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Shopiva Bicycle Spares</title>
<desc id="desc">Modern green Shopiva bicycle spares category artwork featuring a cassette, wheel hubs and gear details.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fff9"/><stop offset="1" stop-color="#dff8e9"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18dc78"/><stop offset="1" stop-color="#0b8f4d"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26323a"/><stop offset=".5" stop-color="#11181d"/><stop offset="1" stop-color="#56636a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".16"/></filter>
</defs>
<rect width="900" height="520" rx="42" fill="url(#bg)"/>
<path d="M0 420C170 360 260 475 420 390S710 290 900 360V520H0Z" fill="#0a7e48" opacity=".10"/>
<!-- cassette -->
<g transform="translate(185 255)" filter="url(#shadow)">
  <circle r="142" fill="#ffffff" stroke="#c9d7d0" stroke-width="8"/>
  <circle r="120" fill="url(#metal)" stroke="#0a0f12" stroke-width="5"/>
  <g fill="none" stroke="#839097" stroke-width="5" opacity=".88">
    <circle r="101"/><circle r="84"/><circle r="67"/><circle r="50"/><circle r="33"/>
  </g>
  <g fill="#141a1e">
    <circle cx="0" cy="-112" r="10"/><circle cx="79" cy="-79" r="10"/><circle cx="112" cy="0" r="10"/><circle cx="79" cy="79" r="10"/><circle cx="0" cy="112" r="10"/><circle cx="-79" cy="79" r="10"/><circle cx="-112" cy="0" r="10"/><circle cx="-79" cy="-79" r="10"/>
  </g>
  <circle r="22" fill="#dce5e0" stroke="#0f171b" stroke-width="7"/>
</g>
<!-- green hub -->
<g transform="translate(520 236) rotate(-8)" filter="url(#shadow)">
  <rect x="-128" y="-34" width="250" height="68" rx="34" fill="url(#green)"/>
  <circle cx="-118" r="54" fill="#0dba62" stroke="#087944" stroke-width="9"/>
  <circle cx="112" r="54" fill="#0dba62" stroke="#087944" stroke-width="9"/>
  <circle cx="-118" r="18" fill="#f0fff6"/><circle cx="112" r="18" fill="#f0fff6"/>
  <path d="M-74-34h32v68h-32zM42-34h32v68H42z" fill="#e8fff1" opacity=".84"/>
  <circle cx="-118" r="10" fill="#2e3a3f"/><circle cx="112" r="10" fill="#2e3a3f"/>
</g>
<!-- gold hub -->
<g transform="translate(635 360)" filter="url(#shadow)">
  <ellipse rx="110" ry="44" fill="#dd8f17" opacity=".28"/>
  <rect x="-95" y="-30" width="190" height="60" rx="30" fill="#ed9b14"/>
  <circle cx="-88" r="46" fill="#f4a81c" stroke="#b96c00" stroke-width="8"/>
  <circle cx="88" r="46" fill="#f4a81c" stroke="#b96c00" stroke-width="8"/>
  <circle cx="-88" r="17" fill="#fff3cf"/><circle cx="88" r="17" fill="#fff3cf"/>
  <rect x="-22" y="-27" width="44" height="54" rx="12" fill="#fff0c8" opacity=".82"/>
</g>
<!-- brand accent -->
<g transform="translate(680 92)">
  <circle r="54" fill="#062c20"/>
  <path d="M-28 10c22-39 48-42 56-30-8 26-30 43-56 49 0-5 0-12 0-19z" fill="#4fe87f"/>
  <path d="M-39-2c11-2 21-11 26-24" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
</g>
<text x="52" y="70" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="34" fill="#073c29">SHOPIVA</text>
<text x="52" y="106" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#13844e">BICYCLE SPARES</text>
</svg>
