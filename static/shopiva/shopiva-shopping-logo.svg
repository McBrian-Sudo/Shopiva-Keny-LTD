<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title>Shopiva Kenya LTD</title><desc>Shopiva premium crown, cart and S emblem.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073d2b"/><stop offset=".52" stop-color="#011711"/><stop offset="1" stop-color="#0a4a2b"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1ff69"/><stop offset=".45" stop-color="#35ea6c"/><stop offset="1" stop-color="#00a35d"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7b0"/><stop offset=".42" stop-color="#ffd34f"/><stop offset="1" stop-color="#d88c0b"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#e7e7e7"/><stop offset="1" stop-color="#c8c8c8"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".35"/></filter>
</defs>
