name: Enforce Admin Live Delivery Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify admin delivery dashboard wiring
        run: |
          grep -q "delivery-map/" home/admin.py
          grep -q "delivery_locations" home/admin.py
          grep -q "Recent Deliveries" home/templates/admin/delivery_map.html
          grep -q "Rider Locations" home/templates/admin/delivery_map.html
          grep -q "All Counties\|county" home/templates/admin/delivery_map.html
          echo "Admin delivery dashboard checks passed."
