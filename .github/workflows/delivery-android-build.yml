name: Shopiva Delivery Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'delivery-android/**'
      - '.github/workflows/delivery-android-build.yml'
  pull_request:
    paths:
      - 'delivery-android/**'
      - '.github/workflows/delivery-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p delivery-android :app:assembleDebug

      - name: Build unsigned release APK and AAB
        run: gradle -p delivery-android :app:assembleRelease :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shopiva-delivery-debug-apk
          path: delivery-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopiva-delivery-release-unsigned
          path: |
            delivery-android/app/build/outputs/apk/release/*.apk
            delivery-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  signed-release:
    if: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 != '' && secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD != '' && secrets.SHOPIVA_ANDROID_KEY_ALIAS != '' && secrets.SHOPIVA_ANDROID_KEY_PASSWORD != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Decode release keystore
        shell: bash
        env:
          SHOPIVA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$SHOPIVA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shopiva-release.jks"

      - name: Build signed release APK and AAB
        env:
          SHOPIVA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shopiva-release.jks
          SHOPIVA_ANDROID_STORE_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD }}
          SHOPIVA_ANDROID_KEY_ALIAS: ${{ secrets.SHOPIVA_ANDROID_KEY_ALIAS }}
          SHOPIVA_ANDROID_KEY_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEY_PASSWORD }}
        run: gradle -p delivery-android :app:assembleRelease :app:bundleRelease

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopiva-delivery-release-signed
          path: |
            delivery-android/app/build/outputs/apk/release/*.apk
            delivery-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
