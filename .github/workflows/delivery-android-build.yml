name: Shopiva Delivery Android Build

on:
  push:
    paths:
      - 'delivery-android/**'
      - '.github/workflows/delivery-android-build.yml'
  pull_request:
    paths:
      - 'delivery-android/**'
      - '.github/workflows/delivery-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p delivery-android :app:assembleDebug
