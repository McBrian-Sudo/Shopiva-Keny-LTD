name: Apply Homepage Redesign

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify homepage hero generator
        run: |
          python scripts/refresh_homepage_hero_v5.py
          git diff --exit-code -- home/templates/home.html
