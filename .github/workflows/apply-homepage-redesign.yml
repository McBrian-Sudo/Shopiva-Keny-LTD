name: Apply Homepage Redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply homepage hero refresh
        run: python scripts/refresh_homepage_hero_v4.py

      - name: Add 20 more homepage slides
        run: python scripts/add_20_homepage_slides.py

      - name: Commit generated homepage changes
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No homepage changes needed."
            exit 0
          fi
          git add home/templates/home.html
          git commit -m "Add 20 more Shopiva homepage slides [skip ci]"
          git push
