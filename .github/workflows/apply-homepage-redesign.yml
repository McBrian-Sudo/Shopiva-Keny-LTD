name: Apply Homepage Redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply homepage redesign
        run: python scripts/redesign_homepage.py

      - name: Commit generated homepage changes
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No homepage changes needed."
            exit 0
          fi
          git add home/templates/home.html
          git commit -m "Redesign Shopiva homepage hero [skip ci]"
          git push
