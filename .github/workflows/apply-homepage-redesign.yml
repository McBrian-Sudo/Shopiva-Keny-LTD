name: Apply Homepage Redesign

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current homepage hero
        run: |
          grep -q "3s\|3000\|3000ms" home/templates/home.html
          grep -q "Explore Categories" home/templates/home.html
          grep -q "Shopiva" home/templates/home.html
          echo "Homepage hero checks passed."
