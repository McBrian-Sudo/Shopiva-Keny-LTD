name: Enhance Customer Delivery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply customer delivery enhancement
        run: python scripts/enhance_customer_delivery.py

      - name: Commit generated changes
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No customer delivery changes needed."
            exit 0
          fi
          git add home/views.py home/templates/includes/delivery_network_map.html
          git commit -m "Show delivery vehicle details to customers [skip ci]"
          git push
