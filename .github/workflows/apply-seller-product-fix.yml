name: Seller Product Safeguard Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify seller product safeguard exists
        run: |
          grep -q "Seller product image upload failed" home/views.py
          grep -q "external image storage provider" home/views.py
          echo "Seller product 500 safeguard is present."
