name: Ensure Customer Map Provider

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-map:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keep Google Maps as canonical provider
        run: python scripts/apply_google_maps_dashboard_upgrade.py
      - name: Commit canonical dashboard when needed
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Google Maps dashboard is already canonical."
            exit 0
          fi
          git add home/views.py home/templates/accounts/dashboard.html home/templates/includes/delivery_network_map.html home/context_processors.py shopiva/settings.py render.yaml
          git commit -m "Keep Google Maps customer dashboard canonical [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
