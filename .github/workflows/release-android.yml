name: Publish Shopiva Delivery Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. delivery-v1.0.0'
        required: true
        default: 'delivery-v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Require production signing secrets
        env:
          KEYSTORE: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SHOPIVA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/shopiva-release.jks"

      - name: Build signed APK and AAB
        env:
          SHOPIVA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shopiva-release.jks
          SHOPIVA_ANDROID_STORE_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD }}
          SHOPIVA_ANDROID_KEY_ALIAS: ${{ secrets.SHOPIVA_ANDROID_KEY_ALIAS }}
          SHOPIVA_ANDROID_KEY_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEY_PASSWORD }}
        run: gradle -p delivery-android :app:assembleRelease :app:bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Shopiva Delivery ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            delivery-android/app/build/outputs/apk/release/*.apk
            delivery-android/app/build/outputs/bundle/release/*.aab
