name: Shopiva Django Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system, deployment, migration and complete regression checks
        env:
          DATABASE_URL: sqlite:///ci.sqlite3
          SECRET_KEY: ci-only-secret-key-9f2d8a7c4e1b6f3a0d5c9b2e7f4a1d8c6b3e0f5a2
          DEBUG: "false"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          CSRF_TRUSTED_ORIGINS: "https://example.invalid"
        run: |
          python manage.py check --deploy
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py system_preflight
          python manage.py test --verbosity 1
      - name: Python compile check
        run: python -m compileall -q home shopiva
