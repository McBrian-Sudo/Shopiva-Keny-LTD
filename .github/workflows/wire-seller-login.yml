name: Seller Login Protection Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated seller login protection
        run: |
          grep -q "def seller_login_required" home/seller_auth.py
          grep -q "seller_login_required(seller_dashboard)" shopiva/urls.py
          grep -q "seller_login_required(seller_product_add)" shopiva/urls.py
          grep -q "seller_login_required(seller_product_edit)" shopiva/urls.py
          grep -q "seller_login_required(seller_product_toggle)" shopiva/urls.py
          grep -q "seller_login_required(seller_product_delete)" shopiva/urls.py
          grep -q "seller_login_required(seller_request_payout)" shopiva/urls.py
          echo "Dedicated seller authentication is enforced."
