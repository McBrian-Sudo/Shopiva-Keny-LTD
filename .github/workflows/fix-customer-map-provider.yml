name: Fix Customer Delivery Map Provider

on:
  workflow_run:
    workflows: ["Enhance Customer Delivery"]
    types: [completed]

permissions:
  contents: write

jobs:
  fix-map:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Re-apply canonical Google Maps dashboard
        run: python scripts/apply_google_maps_dashboard_upgrade.py
      - name: Commit canonical map dashboard
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Google Maps dashboard already canonical."
            exit 0
          fi
          git add home/views.py home/templates/accounts/dashboard.html home/templates/includes/delivery_network_map.html home/context_processors.py shopiva/settings.py render.yaml
          git commit -m "Keep Google Maps customer dashboard canonical [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
