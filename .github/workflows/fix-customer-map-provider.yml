name: Fix Customer Delivery Map Provider

on:
  workflow_run:
    workflows: ["Enhance Customer Delivery"]
    types: [completed]

permissions:
  contents: write

jobs:
  fix-map:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace failing OpenFreeMap Leaflet tiles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("home/templates/includes/delivery_network_map.html")
          text = p.read_text(encoding="utf-8")
          old = "https://tile.openfreemap.org/{z}/{x}/{y}.png"
          new = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}.jpg"
          if old in text:
              text = text.replace(old, new)
          text = text.replace(
              "© <a href=\"https://openfreemap.org\" target=\"_blank\" rel=\"noopener\">OpenFreeMap</a> © OpenMapTiles © OpenStreetMap contributors",
              "Tiles © Esri — World Street Map"
          )
          text = text.replace(
              "Map service temporarily unavailable",
              "Map service temporarily unavailable"
          )
          text = text.replace(
              "The delivery tracker is still active. Please refresh shortly.",
              "The delivery tracker is still active. Please refresh shortly."
          )
          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit map provider fix
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Map provider already fixed."
            exit 0
          fi
          git add home/templates/includes/delivery_network_map.html
          git commit -m "Use reliable street map tiles for customer delivery tracking [skip ci]"
          git push origin main
