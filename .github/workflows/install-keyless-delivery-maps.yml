name: Install Keyless Delivery Maps

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install canonical delivery map template
        run: python scripts/keyless_delivery_maps_upgrade.py
      - name: Verify template contains keyless Google Maps links
        run: |
          grep -q "www.google.com/maps/dir/?api=1" home/templates/includes/delivery_network_map.html
          grep -q "tile.openstreetmap.org" home/templates/includes/delivery_network_map.html
      - name: Commit implementation
        run: |
          git config user.name "shopiva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/templates/includes/delivery_network_map.html scripts/keyless_delivery_maps_upgrade.py
          if git diff --cached --quiet; then
            echo "Keyless delivery maps already installed."
            exit 0
          fi
          git commit -m "Implement keyless live delivery map with Google Maps navigation [skip ci]"
          git push origin main
